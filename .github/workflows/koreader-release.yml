name: KOReader plugin release

# Builds the aidoku.koplugin bundle for every target koreader/build.sh
# supports (armv6, armv7, arm64, x64 -- all linux, since Kindle, Kobo,
# PocketBook, reMarkable, Sony, Cervantes and Android all run a Linux
# kernel and this project is pure Go / no cgo). Every push to main/senpai
# and every v*.*.* tag builds and uploads the zips as workflow artifacts;
# only a tag push additionally attaches them to a GitHub release.
on:
  push:
    branches:
      - main
      - senpai
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # bin_arch:GOARCH:GOARM -- kept in sync with koreader/build.sh
          - { name: armv6, goarch: arm, goarm: "6" }
          - { name: armv7, goarch: arm, goarm: "7" }
          - { name: arm64, goarch: arm64, goarm: "" }
          - { name: x64, goarch: amd64, goarm: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries for ${{ matrix.target.name }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
        run: |
          set -euo pipefail
          out_dir="staging/aidoku.koplugin/bin/${{ matrix.target.name }}"
          mkdir -p "$out_dir"
          for bin in aidoku-run aidoku-downloads; do
            go build -trimpath -ldflags="-s -w" -o "$out_dir/$bin" "./cmd/$bin"
            chmod +x "$out_dir/$bin"
          done

      - name: Assemble plugin bundle
        # Copies everything except bin/ (the repo's bin/ is a gitignored
        # local dev scratch dir -- the binaries just built above are what
        # ships).
        run: rsync -a --exclude='bin' koreader/aidoku.koplugin/ staging/aidoku.koplugin/

      - name: Package zip
        run: |
          set -euo pipefail
          cd staging
          zip -r "../aidoku-koplugin-${{ matrix.target.name }}-${{ github.ref_name }}.zip" aidoku.koplugin

      - uses: actions/upload-artifact@v7
        with:
          name: aidoku-koplugin-${{ matrix.target.name }}
          path: aidoku-koplugin-${{ matrix.target.name }}-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
