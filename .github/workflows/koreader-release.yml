name: KOReader plugin release

# Builds the aidoku.koplugin bundle for every target koreader/build.sh
# supports
on:
  push:
    branches:
      - main
      - senpai
    tags:
      - "v*.*.*"
  # Gate PRs on the same test + build matrix (no release step runs for them)
  pull_request:
    branches:
      - main
      - senpai

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          # bin_arch:GOARCH:GOARM -- kept in sync with koreader/build.sh
          - { name: armv6, goarch: arm, goarm: "6" }
          - { name: armv7, goarch: arm, goarm: "7" }
          - { name: arm64, goarch: arm64, goarm: "" }
          - { name: x64, goarch: amd64, goarm: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Compute bundle name
        # github.ref_name is "<n>/merge" on a PR, which isn't a valid filename
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "BUNDLE_SUFFIX=pr-${{ github.event.number }}" >> "$GITHUB_ENV"
          else
            echo "BUNDLE_SUFFIX=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Build binaries for ${{ matrix.target.name }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm }}
        run: |
          set -euo pipefail
          out_dir="staging/aidoku.koplugin/bin/${{ matrix.target.name }}"
          mkdir -p "$out_dir"
          go build -trimpath -ldflags="-s -w" -o "$out_dir/aidoku-run" ./cmd/aidoku-run
          chmod +x "$out_dir/aidoku-run"

      - name: Assemble plugin bundle
        run: rsync -a --exclude='bin' koreader/aidoku.koplugin/ staging/aidoku.koplugin/

      - name: Stamp version
        # VERSION ships inside the bundle so an installed copy can read its
        # own version at runtime 
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "${{ github.ref_name }}" > staging/aidoku.koplugin/VERSION
          else
            echo "dev-${{ github.event.pull_request.head.sha || github.sha }}" > staging/aidoku.koplugin/VERSION
          fi

      - name: Package zip
        run: |
          set -euo pipefail
          cd staging
          zip -r "../aidoku-koplugin-${{ matrix.target.name }}-${BUNDLE_SUFFIX}.zip" aidoku.koplugin

      - uses: actions/upload-artifact@v7
        with:
          name: aidoku-koplugin-${{ matrix.target.name }}
          path: aidoku-koplugin-${{ matrix.target.name }}-${{ env.BUNDLE_SUFFIX }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
